# Supabase CLI configuration for local development (`supabase start`).
# Secrets are read from the environment; never commit real values.
project_id = "wave"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["wave://auth-callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
# Lets people explore Wave before creating an account; upgrade by linking an identity.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Required for native Google Sign-In on iOS, which does not forward a nonce.
skip_nonce_check = true

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Edge functions verify the caller's JWT themselves (supabase.auth.getUser), so the gateway
# check is disabled; resolve-share is public by design.
[functions.plan-journey]
verify_jwt = false

[functions.route-options]
verify_jwt = false

[functions.journey-control]
verify_jwt = false

[functions.share-link]
verify_jwt = false

[functions.resolve-share]
verify_jwt = false
