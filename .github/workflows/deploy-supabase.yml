name: Deploy Supabase

# Applies migrations and deploys edge functions to the production project.
# Requires repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      ["supabase/**", "packages/types/**", "packages/map-utils/**", "packages/simulation-engine/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip when not configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase secrets are not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.guard.outputs.skip != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - if: steps.guard.outputs.skip != 'true'
        run: node supabase/functions/scripts/vendor.mjs
      - if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
